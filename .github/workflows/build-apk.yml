name: Build Hilal AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_and_android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: echo Android SDK ready

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Setup Python for brand assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate H Ai icon, splash and web logo (Pillow)
        run: |
          python -m pip install --quiet Pillow
          python tools/make_assets.py

      - name: Install icon and splash into Android project
        run: python tools/install_android_assets.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch network security (allow HTTP during dev)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF
          grep -q networkSecurityConfig android/app/src/main/AndroidManifest.xml || \
          sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hilal-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hilal-AI
          path: web_and_android/Hilal-AI.apk
