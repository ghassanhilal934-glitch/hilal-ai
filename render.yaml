# Render Blueprint — انشر باكند Hilal AI كخدمة ويب مجانية
services:
  - type: web
    name: hilal-ai-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # تُدخل قيمها من لوحة Render ولا تُخزّن في المستودع
      - key: HF_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
